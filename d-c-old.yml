version: "5.0.2"

# - Інструкція: https://io-home.ru/home-assistant/docker-container/docker-chast-1-ustanovka-debian/
# - ds ha
# - docker compose up
# - docker compose up portainer
# - docker compose up home-assistant
# - docker compose up code-server
# - docker compose up mariadb
# - docker compose up cloudbeaver
# - docker compose up mosquitto

networks:
  home_assistant:
    name: home_assistant
    driver: bridge

services:

  # Інструкція: https://io-home.ru/home-assistant/docker-container/docker-chast-7-zigbee2mqtt/
  # Zigbee - це бездротовий протокол, подібний до WiFi, але розроблений спеціально для пристроїв IoT.
  # Пристрої з'єднуються в пористу мережу, де пристрої з живленням від мережі
  # (наприклад, лампочки та розумні розетки) виступають як роутери для збільшення радіусу дії мережі.
  # Координатор Zigbee знаходиться в центрі мережі Zigbee і забезпечує взаємодію з пристроями,
  # які не належать до Zigbee.
  #
  # https://io-home.ru/devices/sonoff-zigbee-3-0-usb-dongle-e/
  #
  # http://127.0.0.1:8978/
  #
  #
  #
