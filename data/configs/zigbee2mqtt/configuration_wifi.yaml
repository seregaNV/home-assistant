homeassistant: true

permit_join: false

mqtt:
  base_topic: zigbee2mqtt
  server: '!secret server'
  user: '!secret user'
  password: '!secret password'
  client_id: zigbee

serial:
  port: 'tcp://192.168.0.114:6638'
  baudrate: 115200
  adapter: ember
#  adapter: ezsp
  rtscts: false

frontend:
  port: 8020
